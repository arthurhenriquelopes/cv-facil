<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descrição da Vaga | CV Fácil</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg">
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.js"></script>
</head>

<body>
    <main class="page-content step-content" style="max-width:54rem;margin:0 auto;padding-left:1.5rem;padding-right:1.5rem;">
        <div style="text-align:center;margin-bottom:2.5rem;" class="animate-fade-in-up">
            <h1 id="job-title" class="type-heading"
                style="font-size:1.75rem;font-weight:700;letter-spacing:-0.025em;color:var(--palette-snow);margin-bottom:0.5rem;">
                A Vaga Que Você Quer</h1>
            <p id="job-subtitle" class="type-body" style="color:var(--color-text-secondary);font-size:0.9rem;margin:0;">
                Informe a empresa e cole a descrição da vaga para calibrar seu currículo e o score ATS.</p>
        </div>

        <div class="card" style="padding:2rem;border-radius:0;display:flex;flex-direction:column;gap:1.5rem;">
            <div>
                <label class="form-label" for="company-name">Nome da Empresa Alvo *</label>
                <input type="text" class="form-input" id="company-name"
                    placeholder="Ex: Nubank, Mercado Livre, Google, Itaú..."
                    style="height:3rem;font-size:0.9375rem;">
            </div>

            <div>
                <label class="form-label" for="job-desc">Descrição / Requisitos da Vaga *</label>
                <textarea class="form-input" id="job-desc"
                    style="width:100%;min-height:18rem;font-size:0.875rem;line-height:1.6;resize:vertical;padding:1rem;"
                    placeholder="Cole aqui os requisitos, responsabilidades, tecnologias e qualificações descritas no anúncio da vaga..."></textarea>
            </div>
        </div>
    </main>

    <script type="module">
        import { injectStepHeader, injectStepFooter } from '/src/lib/layout.js';
        import { getState, setState } from '/src/lib/store.js';

        const state = getState();
        const backTarget = state.flow === 'ats' ? '/pages/step-ats-scanner.html' : '/pages/step-profile.html';

        injectStepHeader({ step: 2, backHref: backTarget });
        injectStepFooter({ label: 'Continuar para Análise ATS', id: 'btn-continue', disabled: true });

        const companyInput = document.getElementById('company-name');
        const textarea = document.getElementById('job-desc');
        const btnContinue = document.getElementById('btn-continue');

        if (state.targetCompany) companyInput.value = state.targetCompany;
        if (state.jobDescription) textarea.value = state.jobDescription;

        function checkCanProceed() {
            const companyFilled = companyInput.value.trim().length >= 2;
            const descFilled = textarea.value.trim().length >= 10;
            if (btnContinue) {
                btnContinue.disabled = !(companyFilled && descFilled);
            }
        }

        companyInput.addEventListener('input', checkCanProceed);
        textarea.addEventListener('input', checkCanProceed);
        checkCanProceed();

        btnContinue.addEventListener('click', e => {
            e.preventDefault();
            const company = companyInput.value.trim();
            const desc = textarea.value.trim();

            setState({
                targetCompany: company,
                jobDescription: desc,
                professionalGoal: `Oportunidade na empresa ${company}`,
                targetRole: '',
            });

            window.location.href = '/pages/step-ats-loading.html';
        });

        // Atalho Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey && btnContinue && !btnContinue.disabled) {
                btnContinue.click();
            }
        });
    </script>
</body>

</html>
