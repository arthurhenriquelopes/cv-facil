<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descrição da Vaga | CvPorVaga</title>
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.js"></script>
    <style>
        .job-model-card:hover {
            border-color: var(--color-border-hover);
            box-shadow: var(--shadow-glow);
        }
    </style>
</head>

<body style="padding-bottom: 6rem;">
    <!-- Basic minimal header -->
    <header
        style="border-bottom:1px solid var(--color-border); padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; height: 3.75rem; background: rgba(10, 10, 10, 0.75); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);">
        <div style="width: 2.25rem;"></div>
        <h1 style="font-size:0.875rem; font-weight:700; color:var(--color-text); margin:0;">ATS Scanner Pro</h1>
        <span id="step-gear-mount" style="display:flex;align-items:center;justify-content:center;width:2.25rem;height:2.25rem;"></span>
    </header>

    <main class="page-content step-content" style="max-width:64rem;margin:0 auto;padding-top:3rem;">
        <div style="text-align:center;margin-bottom:2.5rem;">
            <p id="top-link"
                style="color:var(--color-text-tertiary);font-size:0.875rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:center;gap:0.5rem;">
                <a href="/pages/step-ats-scanner.html" style="color:inherit;text-decoration:none;"><i
                        class="pi pi-arrow-left"></i> Voltar e trocar arquivo</a>
            </p>
            <h2 id="job-title"
                style="font-size:clamp(1.5rem,4vw,2rem);font-weight:700;margin-bottom:0.75rem;letter-spacing:-0.025em;color:var(--color-text);">
                A vaga que você quer</h2>
            <p id="job-subtitle" style="color:var(--color-text-secondary);font-weight:500;font-size:1rem;margin:0;">
                Informe a empresa e cole a descrição da vaga para otimizar seu currículo.</p>
        </div>

        <div style="max-width:48rem;margin:0 auto;display:flex;flex-direction:column;gap:1.5rem;">
            <div>
                <label class="form-label" for="company-name">Nome da Empresa (Vaga) *</label>
                <input type="text" class="form-input" id="company-name"
                    placeholder="Ex: Nubank, Mercado Livre, Google, Midas..."
                    style="height:3.25rem;font-size:0.9375rem;">
            </div>

            <div>
                <label class="form-label" for="job-desc">Descrição da Vaga *</label>
                <textarea class="form-input" id="job-desc"
                    style="width:100%;min-height:22rem;font-size:0.875rem;line-height:1.7;resize:vertical;padding:1.5rem;"
                    placeholder="Cole aqui os requisitos, responsabilidades e informações da vaga..."></textarea>
            </div>
        </div>
    </main>

    <!-- Bottom Action Bar -->
    <div
        style="position:fixed;bottom:0;left:0;right:0;padding:1.5rem 1rem;display:flex;justify-content:center;border-top:1px solid var(--color-border);z-index:50;background:rgba(10,10,10,0.85);backdrop-filter:blur(20px);">
        <div style="width:100%;max-width:40rem;">
            <button id="btn-next" disabled
                style="width:100%;height:3.5rem;border-radius:0.5rem;background:var(--color-text);color:var(--color-bg);font-size:1rem;font-weight:700;border:none;cursor:not-allowed;opacity:0.15;transition:all 0.2s;">
                Continuar
            </button>
        </div>
    </div>

    <script type="module">
        import { getState, setState } from '/src/lib/store.js';
        import { injectSettingsGear } from '/src/lib/settings.js';

        const state = getState();
        const companyInput = document.getElementById('company-name');
        const textarea = document.getElementById('job-desc');

        // Restore state
        if (state.targetCompany) companyInput.value = state.targetCompany;
        if (state.jobDescription) textarea.value = state.jobDescription;

        // Flow logic
        if (state.flow === 'ats') {
            document.querySelector('header h1').textContent = 'ATS Scanner Pro';
            document.getElementById('job-title').textContent = 'A vaga que você quer';
            document.getElementById('job-subtitle').textContent = 'Informe a empresa e cole a descrição da vaga para analisar compatibilidade.';
            document.getElementById('btn-next').textContent = 'Analisar Compatibilidade';
            document.getElementById('top-link').innerHTML = '<a href="/pages/step-ats-scanner.html" style="color:inherit;text-decoration:none;"><i class="pi pi-arrow-left"></i> Voltar e trocar arquivo</a>';
        } else {
            document.querySelector('header h1').textContent = 'Gerador CV Otimizado';
            document.getElementById('job-title').textContent = 'Onde você quer trabalhar?';
            document.getElementById('job-subtitle').textContent = 'Informe a empresa e cole a descrição da vaga para otimizar seu currículo.';
            document.getElementById('btn-next').textContent = 'Continuar';
            document.getElementById('top-link').innerHTML = '<a href="/pages/step-profile.html" style="color:inherit;text-decoration:none;"><i class="pi pi-arrow-left"></i> Voltar à edição de perfil</a>';
        }

        function checkCanProceed() {
            const companyFilled = companyInput.value.trim().length >= 2;
            const descFilled = textarea.value.trim().length >= 10;
            const btn = document.getElementById('btn-next');

            if (companyFilled && descFilled) {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
                btn.disabled = false;
                btn.style.cursor = 'pointer';
            } else {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.15';
                btn.disabled = true;
                btn.style.cursor = 'not-allowed';
            }
        }

        companyInput.addEventListener('input', checkCanProceed);
        textarea.addEventListener('input', checkCanProceed);

        // Trigger check on load
        checkCanProceed();

        const mount = document.getElementById('step-gear-mount');
        if (mount) injectSettingsGear(mount);

        document.getElementById('btn-next').addEventListener('click', e => {
            e.preventDefault();
            const company = companyInput.value.trim();
            const desc = textarea.value.trim();

            setState({
                targetCompany: company,
                jobDescription: desc,
                professionalGoal: `Oportunidade na empresa ${company}`,
                targetRole: '',
            });

            // Both flows go through step-ats-loading now
            window.location.href = '/pages/step-ats-loading.html';
        });
    </script>
</body>

</html>
